#@TYPE: Machine
#@NAME: stm32mp1-som
#@DESCRIPTION: Emcraft STM32MP1 SOM
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

include conf/machine/stm32mp15-eval.conf

BOOTDEVICE_LABELS = "emmc sdcard"

STM32MP_DT_FILES_SDCARD := "stm32mp157d-bsb"
STM32MP_DT_FILES_EMMC := "stm32mp157d-bsb"

KERNEL_DEVICETREE := "stm32mp157a-som.dtb stm32mp157d-som.dtb \
		  stm32mp157a-bsb.dtb stm32mp157d-bsb.dtb"

UBOOT_EXTLINUX_TARGETS_EXTRA_CONFIG:target-emmc = "stm32mp157d-bsb"
UBOOT_EXTLINUX_TARGETS_EXTRA_CONFIG:target-sdcard = "stm32mp157d-bsb"
UBOOT_EXTLINUX_TARGETS_EXTRA_CONFIG[stm32mp157d-bsb] = "stm32mp157a-som stm32mp157d-som \
		  stm32mp157a-bsb"

UBOOT_EXTLINUX_DEFAULT_LABEL:stm32mp157d-bsb = "stm32mp157d-bsb"
UBOOT_EXTLINUX_TIMEOUT = "1"

UBOOT_EXTLINUX_FDT:stm32mp157a-som = "stm32mp157a-som.dtb"
UBOOT_EXTLINUX_FDT:stm32mp157a-bsb = "stm32mp157a-bsb.dtb"
UBOOT_EXTLINUX_FDT:stm32mp157d-bsb = "stm32mp157d-bsb.dtb"
UBOOT_EXTLINUX_FDT:stm32mp157d-som = "stm32mp157d-som.dtb"

LINUX_A7_EXAMPLES_DT := ""
CUBE_M4_EXAMPLES_DT := ""

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-emcraft"
BBFILE_PATTERN_meta-emcraft = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-emcraft = "16"

LAYERDEPENDS_meta-emcraft = "core"
LAYERSERIES_COMPAT_meta-emcraft = "dunfell"
